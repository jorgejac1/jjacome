name: Production quality gates
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run validate:content
      - run: npm run test
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-report
          path: playwright-report/
      - name: Check rendered routes and assets
        run: |
          npm start > /tmp/portfolio-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do curl -fsS http://localhost:3000/ >/dev/null && break; sleep 1; done
          python3 scripts/check-portfolio-links.py http://localhost:3000
          mkdir -p performance-report
          for locale in en es; do
            route="/"
            if [ "$locale" = "es" ]; then route="/es"; fi
            for sample in 1 2 3; do
              npx --yes lighthouse@13.4.1 "http://localhost:3000$route" --chrome-flags="--headless --no-sandbox" --only-categories=performance --output=json --output-path="performance-report/$locale-$sample.json" --quiet
            done
          done
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const median = values => [...values].sort((a,b) => a-b)[1];
          for (const locale of ['en', 'es']) {
            const samples = [1,2,3].map(sample => {
              const report = JSON.parse(readFileSync(`performance-report/${locale}-${sample}.json`, 'utf8'));
              if (report.runtimeError) throw new Error(report.runtimeError.message);
              const lcpMs = report.audits['largest-contentful-paint'].numericValue;
              const cls = report.audits['cumulative-layout-shift'].numericValue;
              const tbtMs = report.audits['total-blocking-time'].numericValue;
              const score = report.categories.performance.score * 100;
              if (![lcpMs, cls, tbtMs, score].every(Number.isFinite)) throw new Error(`${locale}: missing or invalid performance measurements`);
              return { lcpMs, cls, tbtMs, score };
            });
            const result = Object.fromEntries(['lcpMs','cls','tbtMs','score'].map(key => [key, median(samples.map(sample => sample[key]))]));
            console.log(JSON.stringify({locale, method:'median of three fresh mobile runs', samples, ...result}));
            if (result.lcpMs > 2500 || result.cls > 0.1 || result.tbtMs > 200) throw new Error(`${locale}: mobile performance budget exceeded`);
          }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-performance-report
          path: performance-report/
# Vercel Git integration builds main with automatic domain assignment disabled.
# Promote the reviewed staged production deployment only after this job and browser QA pass.
