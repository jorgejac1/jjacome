name: Production quality gates
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run validate:content
      - run: npm run test
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-report
          path: playwright-report/
      - name: Check rendered routes and assets
        run: |
          npm start > /tmp/portfolio-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do curl -fsS http://localhost:3000/ >/dev/null && break; sleep 1; done
          python3 scripts/check-portfolio-links.py http://localhost:3000
# Vercel Git integration builds main with automatic domain assignment disabled.
# Promote the reviewed staged production deployment only after this job and browser QA pass.
