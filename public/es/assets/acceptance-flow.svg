<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
<title id="title">Evalgate: la finalización depende del verificador</title><desc id="desc">Un contrato de aceptación explícito pasa al verificador. Se conserva su salida. Un resultado aprobado actualiza el contrato; un fallo lo deja pendiente para inspección y reintento explícito. Solo se demuestra la propiedad evaluada.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#a9ca79"/></marker></defs>
<rect width="1120" height="680" rx="16" fill="#101812"/><g font-family="Arial,Helvetica,sans-serif" fill="#f2f5ec"><text x="52" y="62" font-size="16" fill="#b3c0ac">EVALGATE / FLUJO DE VERIFICACIÓN IMPLEMENTADO</text><text x="52" y="110" font-size="34" font-weight="700">La finalización depende del verificador.</text>
<g fill="#1a261d" stroke="#7e9870" stroke-width="2"><rect x="52" y="178" width="265" height="154" rx="10"/><rect x="411" y="178" width="285" height="154" rx="10"/><rect x="801" y="160" width="267" height="112" rx="10"/><rect x="801" y="315" width="267" height="112" rx="10"/></g>
<g fill="none" stroke="#a9ca79" stroke-width="3" marker-end="url(#arrow)"><path d="M317 255H407"/><path d="M696 255H750V216H797"/><path d="M750 255V370H797"/></g>
<text x="76" y="214" font-size="14" fill="#b9d793">CONTRATO DE ACEPTACIÓN</text><text x="76" y="250" font-size="20" font-weight="700">Tarea + criterio</text><text x="76" y="283" font-size="16">Definir la propiedad</text><text x="76" y="309" font-size="16">que se debe comprobar.</text>
<text x="435" y="214" font-size="14" fill="#b9d793">VERIFICADOR EJECUTABLE</text><text x="435" y="250" font-size="20" font-weight="700">Evaluar la condición</text><text x="435" y="283" font-size="16">Conservar resultado y salida</text><text x="435" y="309" font-size="16">para su inspección.</text>
<text x="825" y="196" font-size="14" fill="#b9d793">APROBADO</text><text x="825" y="235" font-size="20" font-weight="700">Actualizar el contrato</text><text x="825" y="352" font-size="14" fill="#ffd0a6">FALLO</text><text x="825" y="390" font-size="20" font-weight="700">Mantener pendiente</text>
<path d="M52 471H1068" stroke="#465541"/>
<text x="52" y="514" font-size="17" fill="#b9d793">01 / RESTRICCIÓN</text><text x="52" y="548" font-size="19">El informe del agente no</text><text x="52" y="576" font-size="19">es evidencia de aceptación.</text>
<text x="411" y="514" font-size="17" fill="#b9d793">02 / DECISIÓN</text><text x="411" y="548" font-size="19">Usar pruebas explícitas y</text><text x="411" y="576" font-size="19">conservar su salida.</text>
<text x="801" y="514" font-size="17" fill="#b9d793">03 / RESULTADO</text><text x="801" y="548" font-size="19">Inspeccionar el fallo antes</text><text x="801" y="576" font-size="19">de un reintento explícito.</text>
<text x="52" y="635" font-size="17" fill="#b3c0ac">Solo se demuestra la propiedad evaluada. No se implica un límite automático de reintentos.</text></g></svg>
