<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
<title id="title">Evalgate: completion follows the verifier</title><desc id="desc">An explicit acceptance contract enters a verifier. Its output is retained. A passing result updates the contract; a failure leaves it pending for inspection and an explicit retry. A pass only establishes the checked property.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#a9ca79"/></marker></defs>
<rect width="1120" height="680" rx="16" fill="#101812"/><g font-family="Arial,Helvetica,sans-serif" fill="#f2f5ec"><text x="52" y="62" font-size="18" fill="#b3c0ac">EVALGATE / IMPLEMENTED VERIFICATION PATH</text><text x="52" y="110" font-size="34" font-weight="700">Completion follows the verifier.</text>
<g fill="#1a261d" stroke="#7e9870" stroke-width="2"><rect x="52" y="178" width="265" height="154" rx="10"/><rect x="411" y="178" width="285" height="154" rx="10"/><rect x="801" y="160" width="267" height="112" rx="10"/><rect x="801" y="315" width="267" height="112" rx="10"/></g>
<g fill="none" stroke="#a9ca79" stroke-width="3" marker-end="url(#arrow)"><path d="M317 255H407"/><path d="M696 255H750V216H797"/><path d="M750 255V370H797"/></g>
<text x="76" y="214" font-size="16" fill="#b9d793">ACCEPTANCE CONTRACT</text><text x="76" y="250" font-size="23" font-weight="700">Task + criterion</text><text x="76" y="283" font-size="18">Define the property</text><text x="76" y="309" font-size="18">the check must establish.</text>
<text x="435" y="214" font-size="16" fill="#b9d793">EXECUTABLE VERIFIER</text><text x="435" y="250" font-size="23" font-weight="700">Run the condition</text><text x="435" y="283" font-size="18">Retain result and output</text><text x="435" y="309" font-size="18">for inspection.</text>
<text x="825" y="196" font-size="16" fill="#b9d793">PASS</text><text x="825" y="235" font-size="23" font-weight="700">Update completion</text><text x="825" y="352" font-size="16" fill="#ffd0a6">FAILURE</text><text x="825" y="390" font-size="23" font-weight="700">Keep pending</text>
<path d="M52 471H1068" stroke="#465541"/>
<text x="52" y="514" font-size="17" fill="#b9d793">01 / CONSTRAINT</text><text x="52" y="548" font-size="19">An agent report is not</text><text x="52" y="576" font-size="19">acceptance evidence.</text>
<text x="411" y="514" font-size="17" fill="#b9d793">02 / DECISION</text><text x="411" y="548" font-size="19">Use explicit checks and</text><text x="411" y="576" font-size="19">retain their output.</text>
<text x="801" y="514" font-size="17" fill="#b9d793">03 / RESULT</text><text x="801" y="548" font-size="19">Inspect failure before</text><text x="801" y="576" font-size="19">an explicit retry.</text>
<text x="52" y="635" font-size="17" fill="#b3c0ac">A passing check establishes only the checked property. No automatic retry budget is implied.</text></g></svg>
